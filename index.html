<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Video Player - V1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .input-container { margin: 20px auto; max-width: 600px; }
        input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
        .player-container { width: 100%; max-width: 800px; margin: 20px auto; background: #000; border-radius: 8px; overflow: hidden; }
        .player-container:empty { display: none; }
        .player-container video { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
        .youtube-frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
        .twitter-tweet { margin: 0 auto !important; }
        #debug { color: #888; font-size: 12px; margin-top: 10px; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <h2>Group Media Sync</h2>
    
    <div class="input-container">
        <input type="text" id="linkInput" placeholder="Paste YouTube, X, or Insta link here..." aria-label="Video or post link">
    </div>

    <div class="player-container" id="player"></div>
    <div id="debug" aria-live="polite"></div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function parseUrl(value) {
            try {
                return new URL(value.trim());
            } catch {
                return null;
            }
        }

        function getYouTubeVideoId(parsed) {
            const host = parsed.hostname.toLowerCase().replace(/^www\./, '');
            if (host === 'youtu.be') {
                return parsed.pathname.split('/').filter(Boolean)[0] || '';
            }
            if (!['youtube.com', 'm.youtube.com', 'youtube-nocookie.com'].includes(host)) {
                return '';
            }
            if (parsed.pathname === '/watch') {
                return parsed.searchParams.get('v') || '';
            }
            const match = parsed.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/);
            return match ? match[1] : '';
        }

        function getTwitterWidgets() {
            if (window.twttr && window.twttr.widgets) {
                return Promise.resolve(window.twttr);
            }
            if (window.twitterWidgetsPromise) {
                return window.twitterWidgetsPromise;
            }

            window.twitterWidgetsPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://platform.twitter.com/widgets.js';
                script.async = true;
                script.onload = () => window.twttr && window.twttr.widgets
                    ? resolve(window.twttr)
                    : reject(new Error('X embed tools did not load'));
                script.onerror = () => reject(new Error('Could not load X embed tools'));
                document.head.appendChild(script);
            });
            return window.twitterWidgetsPromise;
        }

        function loadVideo(value) {
            const parsed = parseUrl(value);
            if (!parsed || !['http:', 'https:'].includes(parsed.protocol)) return;

            const container = document.getElementById('player');
            const debugLog = document.getElementById('debug');
            const host = parsed.hostname.toLowerCase().replace(/^www\./, '');
            const videoId = getYouTubeVideoId(parsed);
            container.replaceChildren();

            if (videoId && /^[\w-]{11}$/.test(videoId)) {
                debugLog.innerText = 'Loading YouTube video...';
                const iframe = document.createElement('iframe');
                iframe.className = 'youtube-frame';
                iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&playsinline=1`;
                iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; web-share';
                iframe.allowFullscreen = true;
                iframe.title = 'YouTube video player';
                container.appendChild(iframe);
                return;
            }

            if (host === 'x.com' || host === 'twitter.com' || host === 'mobile.twitter.com') {
                const status = parsed.pathname.match(/\/status(?:es)?\/(\d+)/i);
                if (!status) {
                    debugLog.innerText = 'This X link is not a post with an embeddable status.';
                    return;
                }

                debugLog.innerText = 'Loading X post and video...';
                const quote = document.createElement('blockquote');
                quote.className = 'twitter-tweet';
                const link = document.createElement('a');
                link.href = `https://twitter.com/i/status/${status[1]}`;
                link.textContent = 'View this post on X';
                quote.appendChild(link);
                container.appendChild(quote);

                getTwitterWidgets()
                    .then(twttr => twttr.widgets.load(container))
                    .then(() => { debugLog.innerText = ''; })
                    .catch(error => { debugLog.innerText = `${error.message}. Open the post on X to watch its video.`; });
                return;
            }

            if (host === 'instagram.com' || host === 'www.instagram.com') {
                debugLog.innerText = 'Instagram posts need Instagram’s embed player and may not play in this page.';
                const link = document.createElement('a');
                link.href = parsed.href;
                link.textContent = 'Open post on Instagram';
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                container.appendChild(link);
                return;
            }

            debugLog.innerText = 'Playing direct video source...';
            const video = document.createElement('video');
            video.src = parsed.href;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            container.appendChild(video);
        }

        function findSharedUrl(value) {
            const match = value.match(/https?:\/\/[^\s<>"']+/i);
            return match ? match[0].replace(/[),.!?]+$/, '') : '';
        }

        const input = document.getElementById('linkInput');
        let inputTimer;
        input.addEventListener('input', () => {
            clearTimeout(inputTimer);
            inputTimer = setTimeout(() => loadVideo(input.value), 500);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const pageUrl = new URL(window.location.href);
            const sharedText = pageUrl.searchParams.get('url') || pageUrl.searchParams.get('text') || '';
            const sharedUrl = findSharedUrl(sharedText);
            if (sharedUrl) {
                input.value = sharedUrl;
                loadVideo(sharedUrl);
            }
        });
    </script>
</body>
</html>
