<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Video Player - V1</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .input-container { margin: 20px auto; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .player-container { width: 100%; max-width: 800px; margin: 20px auto; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        iframe, video { width: 100%; height: 100%; border: none; }
        #debug { color: #888; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Group Media Sync</h2>
    
    <div class="input-container">
        <input type="text" id="linkInput" placeholder="Paste YouTube, X, or Insta link here...">
        <button onclick="handleManualPaste()">Play</button>
    </div>

    <div class="player-container" id="player">
        <p id="status" style="padding: 40px; color: #aaa;">Paste a video link above or share a link directly from WhatsApp.</p>
    </div>
    <div id="debug"></div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function getYouTubeVideoId(value) {
            let parsed;
            try {
                parsed = new URL(value);
            } catch {
                return '';
            }

            const host = parsed.hostname.toLowerCase().replace(/^www\./, '');
            if (host === 'youtu.be') {
                const parts = parsed.pathname.split('/').filter(Boolean);
                return parts[0] || '';
            }
            if (host !== 'youtube.com' && host !== 'm.youtube.com' && host !== 'youtube-nocookie.com') {
                return '';
            }

            if (parsed.pathname === '/watch') {
                return parsed.searchParams.get('v') || '';
            }

            const pathMatch = parsed.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/);
            return pathMatch ? pathMatch[1] : '';
        }

        function loadVideo(url) {
            if (!url) return;
            const container = document.getElementById('player');
            const debugLog = document.getElementById('debug');
            const cleanUrl = url.trim();
            const videoId = getYouTubeVideoId(cleanUrl);

            debugLog.innerText = "Processing URL: " + cleanUrl;

            if (videoId && /^[\w-]{11}$/.test(videoId)) {
                debugLog.innerText = "Found YouTube ID: " + videoId;
                const iframe = document.createElement('iframe');
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1`;
                iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; web-share';
                iframe.allowFullscreen = true;
                iframe.title = 'YouTube video player';
                container.replaceChildren(iframe);
                return;
            }
            
            if (cleanUrl.includes('instagram.com') || cleanUrl.includes('x.com') || cleanUrl.includes('twitter.com')) {
                debugLog.innerText = "Loading social media iframe...";
                const iframe = document.createElement('iframe');
                iframe.src = cleanUrl;
                iframe.allowFullscreen = true;
                container.replaceChildren(iframe);
                return;
            }

            debugLog.innerText = "Playing direct video source...";
            const video = document.createElement('video');
            video.src = cleanUrl;
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            container.replaceChildren(video);
        }

        function handleManualPaste() {
            const inputVal = document.getElementById('linkInput').value;
            loadVideo(inputVal);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const parsedUrl = new URL(window.location.href);
            const sharedUrl = parsedUrl.searchParams.get('url') || parsedUrl.searchParams.get('text');
            
            if (sharedUrl) {
                const urlMatch = sharedUrl.match(/https?:\/\/[^\s]+/i);
                if (urlMatch && urlMatch[0]) {
                    const cleanedSharedUrl = urlMatch[0].replace(/[),.!?]+$/, '');
                    document.getElementById('linkInput').value = cleanedSharedUrl;
                    loadVideo(cleanedSharedUrl);
                }
            }
        });
    </script>
</body>
</html>
