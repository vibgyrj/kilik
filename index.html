<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Video Player</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .input-container { margin: 20px auto; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .player-container { width: 100%; max-width: 800px; margin: 20px auto; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        iframe, video { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <h2>Group Media Sync</h2>
    
    <div class="input-container">
        <input type="text" id="linkInput" placeholder="Paste YouTube, X, or Insta link here...">
        <button onclick="handleManualPaste()">Play</button>
    </div>

    <div class="player-container" id="player">
        <p style="padding: 40px; color: #aaa;">Paste a video link above or share a link directly from WhatsApp.</p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function loadVideo(url) {
            if (!url) return;
            const container = document.getElementById('player');
            let cleanUrl = url.trim();
            let videoId = '';

            // 1. Handle YouTube Shortened Share Links (youtu.be/abc)
            if (cleanUrl.includes('youtu.be/')) {
                const parts = cleanUrl.split('youtu.be/');
                if (parts[1]) {
                    videoId = parts[1].split('?')[0].split('#')[0];
                }
            } 
            // 2. Handle YouTube Shorts Links (youtube.com/shorts/abc)
            else if (cleanUrl.includes('youtube.com/shorts/')) {
                const parts = cleanUrl.split('shorts/');
                if (parts[1]) {
                    videoId = parts[1].split('?')[0].split('#')[0];
                }
            }
            // 3. Handle Standard Desktop YouTube Links (://youtube.com)
            else if (cleanUrl.includes('youtube.com')) {
                try {
                    const urlParams = new URLSearchParams(new URL(cleanUrl).search);
                    videoId = urlParams.get('v');
                } catch(e) {
                    console.error("URL Parsing failed", e);
                }
            }

            // If we found a valid YouTube ID, render the clean iframe
            if (videoId) {
                container.innerHTML = `<iframe src="https://youtube.com{videoId}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                return;
            }
            
            // Fallback for Instagram & Twitter (X) links
            if (cleanUrl.includes('instagram.com') || cleanUrl.includes('x.com') || cleanUrl.includes('twitter.com')) {
                container.innerHTML = `<iframe src="${cleanUrl}" allowfullscreen></iframe>`;
                return;
            }

            // Direct Video links (mp4, webm)
            container.innerHTML = `<video src="${cleanUrl}" controls autoplay style="width:100%; height:100%;"></video>`;
        }

        function handleManualPaste() {
            const inputVal = document.getElementById('linkInput').value;
            loadVideo(inputVal);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const parsedUrl = new URL(window.location.href);
            const sharedUrl = parsedUrl.searchParams.get('url') || parsedUrl.searchParams.get('text');
            
            if (sharedUrl) {
                const urlMatch = sharedUrl.match(/\bhttps?:\/\/\S+/gi);
                if (urlMatch) {
                    document.getElementById('linkInput').value = urlMatch[0];
                    loadVideo(urlMatch[0]);
                }
            }
        });
    </script>
</body>
</html>
